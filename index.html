<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Album | Sakura Edition</title>
  <meta name="description" content="うさぎラジオ 六曲入りミニアルバム（桜背景バージョン）" />
  <style>
    :root {
      --bg: #fff0f6;
      --card: #ffffffcc;
      --text: #4a2c3a;
      --muted: #9c6f82;
      --accent: #ff7aa8;
      --border: rgba(255, 160, 200, .35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background:
        radial-gradient(800px 400px at 20% -10%, #ffd6e7, transparent),
        radial-gradient(600px 400px at 90% 10%, #ffe3ef, transparent),
        linear-gradient(180deg, #fff0f6, #ffe4ef);
      color: var(--text);
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    header {
      display: grid;
      gap: 16px;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      width: fit-content;
      background: white;
    }

    h1 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 0;
    }

    .meta { color: var(--muted); }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
    }

    .cover {
      aspect-ratio: 1/1;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(255, 150, 200, .25);
      background: #ffe4ef;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
    }

    .tracklist {
      display: grid;
      gap: 12px;
    }

    .track {
      display: grid;
      grid-template-columns: 40px 1fr;
      grid-template-rows: auto auto;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.6);
    }

    .track audio {
      grid-column: 1 / -1;
      width: 100%;
    }

    .num {
      color: var(--muted);
      text-align: right;
      font-weight: 600;
    }

    .title { font-weight: 600; }

    .desc {
      color: var(--muted);
      font-size: 14px;
    }

    audio { width: 100%; }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <span class="badge">Mini Album</span>
      <h1>うさぎラジオ ミニアルバム</h1>
      <div class="meta">6 Tracks ・ Sakura Edition</div>
    </header>

    <section class="hero">
      <div class="cover">
        <img src="cover.jpg" alt="Album Cover">
      </div>

      <div class="card">
        <p>
          「どんな色だって、キミだけの光」
          桜色の空気に包まれながら、
          孤独な夜にも、やわらかく寄り添うミニアルバム。
        </p>
      </div>
    </section>

    <section class="card" style="margin-top:24px;">
      <h2 style="margin-top:0;">Tracklist</h2>

      <div class="tracklist">

        <div class="track">
          <div class="num">01</div>
          <div>
            <div class="title">うさぎロケット</div>
            <div class="desc">希望を宇宙まで押し上げるブースター</div>
          </div>
          <audio controls playsinline preload="none" src="track01 うさぎロケット.mp3"></audio>
        </div>

        <div class="track">
          <div class="num">02</div>
          <div>
            <div class="title">うさぎマジック</div>
            <div class="desc">世界を少しだけ優しく塗り替える魔法</div>
          </div>
          <audio controls playsinline preload="none" src="track02 うさぎマジック.mp3"></audio>
        </div>

        <div class="track">
          <div class="num">03</div>
          <div>
            <div class="title">うさぎアイランド</div>
            <div class="desc">境界線のない海を渡るカラフルな航海</div>
          </div>
          <audio controls playsinline preload="none" src="track03 うさぎアイランド.mp3"></audio>
        </div>

        <div class="track">
          <div class="num">04</div>
          <div>
            <div class="title">反逆のプリズム</div>
            <div class="desc">退屈な夜を虹色に裂く閃光</div>
          </div>
          <audio controls playsinline preload="none" src="track04 反逆のプリズム.mp3"></audio>
        </div>

        <div class="track">
          <div class="num">05</div>
          <div>
            <div class="title">３８万キロ</div>
            <div class="desc">夜の隣に寄り添うバラード</div>
          </div>
          <audio controls playsinline preload="none" src="track05 ３８万キロ.mp3"></audio>
        </div>

        <div class="track">
          <div class="num">06</div>
          <div>
            <div class="title">うさぎラジオ ON AIR</div>
            <div class="desc">月面の秘密基地からの放送</div>
          </div>
          <audio controls playsinline preload="none" src="track06 うさぎラジオ ON AIR.mp3"></audio>
        </div>

      </div>
    </section>

    <footer>
      ありがとう、聴いてくれて。
    </footer>

  </div>
</body>
</html>
